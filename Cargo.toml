[package]
name = "rusty-about-me"
version = "0.1.0"
edition = "2024"

[dependencies]
eyre = "0.6"
html-escape = "0.2"
mkwebfont_hb-subset = "0.5"
pulldown-cmark = "*"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sigilbuzz-woff = { version = "0.3", default-features = false, features = ["std", "woff2"] }
ureq = "3"
walkdir = "*"

[profile.dev.package."*"]
opt-level = 3
